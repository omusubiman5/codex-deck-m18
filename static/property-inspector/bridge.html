<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Codex 接続</title>
<style>body{font:12px "Segoe UI",sans-serif;background:#2d2d2d;color:#eee;padding:14px}</style></head>
<body>
<script src="bridge.js"></script>
<script>
window.connectElgatoStreamDeckSocket = (port, uuid, registerEvent, info, actionInfo) => {
  const socket = new WebSocket(`ws://127.0.0.1:${port}`);
  socket.addEventListener("open", () => socket.send(JSON.stringify({event:registerEvent, uuid})));
  window.attachBridgeControls(socket, actionInfo);
};
</script>
</body></html>
