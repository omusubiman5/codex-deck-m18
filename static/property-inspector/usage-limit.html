<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Usage Limit</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; padding: 14px; color: #d8d8d8; background: #2d2d2d; font-size: 12px; }
    label { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 8px; }
    select { width: 100%; min-height: 28px; color: #efefef; background: #3b3b3b; border: 1px solid #555; border-radius: 4px; padding: 3px 7px; }
    p { margin: 12px 0 0 100px; color: #a9a9a9; line-height: 1.35; }
  </style>
</head>
<body>
  <label>
    <span>Limit window</span>
    <select id="mode">
      <option value="auto">Automatic</option>
      <option value="five-hour">5 hours</option>
      <option value="weekly">Weekly</option>
    </select>
  </label>
  <p>Automatic prefers the 5-hour window and falls back to weekly when Codex does not provide it.</p>
  <script src="bridge.js"></script>
  <script>
    let websocket;
    let context;
    let settings = {};

    window.connectElgatoStreamDeckSocket = (port, uuid, registerEvent, info, actionInfo) => {
      const action = JSON.parse(actionInfo);
      context = action.context;
      settings = action.payload?.settings ?? {};
      const mode = ["auto", "five-hour", "weekly"].includes(settings.mode) ? settings.mode : "auto";
      document.getElementById("mode").value = mode;
      websocket = new WebSocket(`ws://127.0.0.1:${port}`);
      websocket.addEventListener("open", () => websocket.send(JSON.stringify({ event: registerEvent, uuid })));
      window.attachBridgeControls(websocket, actionInfo);
    };

    document.getElementById("mode").addEventListener("change", (event) => {
      settings = { ...settings, mode: event.target.value };
      if (websocket?.readyState === WebSocket.OPEN) {
        websocket.send(JSON.stringify({ event: "setSettings", context, payload: settings }));
      }
    });
  </script>
</body>
</html>
