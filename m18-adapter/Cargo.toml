[package]
name = "codex-deck-m18-adapter"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Minimal VSD Inside M18 transport for Codex Deck"

[dependencies]
data-url = "0.3.1"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png"] }
mirajazz = "0.9.0"
resvg = "0.45.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.44.2", features = ["io-std", "io-util", "macros", "rt-multi-thread", "time"] }
